[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsafm-eventaudit"
version = "0.2.0rc1"
description = "EventAudit method source and selected archived HS-AFM research materials"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Kateryna Muzyka"}]
keywords = ["HS-AFM", "EventAudit", "bioimage analysis", "archival methods", "source inspection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "scikit-learn>=1.3",
  "matplotlib>=3.7", "AFMReader>=0.0.7", "threadpoolctl>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
